    · 바탕 지도 자료: 같은 사이트에서 열면 data/, 아니면 공개 CDN(아래 CDN 상수)에서 받아 옵니다.
      다른 자료를 쓰려면 window.SA_DATA 에 주소를 넣으세요(예: <script>window.SA_DATA='https://…/data/'</script>).
    · 고칠 곳 찾기: 「획 저장소」(되돌리기·GeoJSON), 「크로키」(그리기 도구·바탕 지도·저장), 「SEED 어댑터」(단추·칩 모양).

<style>
:root {
  --ink: #111;
  --ink-2: #4a4a4a;
  --ink-3: #9a9a9a;
  --line: #e6e6e6;
  --paper: #fff;
  --soft: #f6f5f2;
  --accent: #b3261e;
  --accent-soft: rgba(179, 38, 30, .14);
  --en: 'Instrument Sans', 'Pretendard', sans-serif;
  --ko: 'Pretendard', 'Instrument Sans', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --gut: clamp(16px, 4.2vw, 100px);
}
.btn:not([data-seed-cls]) { font: inherit; font-size: 14px; background: var(--ink); color: #fff; border: 0; padding: 11px 20px; text-decoration: none; cursor: pointer; transition: background .2s; }
.btn:not([data-seed-cls]):hover { background: var(--accent); }
.ctrl select { font: inherit; font-size: 14px; border: 1px solid var(--ink); padding: 9px 12px; background: #fff; min-width: 200px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chips button:not([data-seed-cls]) { font: inherit; font-size: 13px; background: #fff; border: 1px solid var(--line); padding: 6px 11px; cursor: pointer; color: var(--ink-2); transition: all .15s; }
.chips button:not([data-seed-cls]):hover { border-color: var(--ink); color: var(--ink); }
.chips button.on:not([data-seed-cls]) { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.ghost:not([data-seed-cls]) { background: #fff; color: var(--ink); border: 1px solid var(--ink); }
.btn.ghost:not([data-seed-cls]):hover { background: var(--soft); }
.sk-map { width: 100%; font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); background: #fff; margin-bottom: 12px; }
.sk-row { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-bottom: 4px; }
.sk-colors { display: flex; gap: 6px; margin-bottom: 16px; }
.sk-colors button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: var(--c); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }

.sketch .ctrl { margin-bottom: 10px; }

}

input[type="file"]::file-selector-button {

.sk-colors button { border-radius: 50%; }
/* 레시피가 없는 작은 단추·상자도 SEED 모서리·테두리에 맞춤 */
.sk-layers { border-radius: var(--seed-radius-r2); border-color: var(--seed-color-stroke-neutral-weak); overflow: hidden; }

/* 크게 보기 단추(SEED action-button)는 지도·3D 위에 떠 있으니 흰 바탕을 깐다 */

.t-dock { width: 330px; background: var(--seed-color-bg-layer-floating, #fff); border: 0; border-radius: var(--seed-radius-r3); box-shadow: var(--seed-shadow-s3); padding: 6px 18px 16px; }

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
/* ── SEED 어댑터 (assets/seed.js) ── */
// SEED Design(당근 디자인 시스템, @seed-design/css 3.0.2, Apache-2.0) 어댑터 — 중립색(neutral) 톤.
// 페이지의 기존 마크업(.btn · .chips button · 체크박스)에 SEED 레시피 클래스를 입힌다.
// 상태(.ghost · .on · .t-small)가 스크립트로 바뀌어도 따라가도록 DOM 변화를 지켜본다.
(() => {
  // @seed-design/css recipes/shared.mjs 의 createClassName 과 같은 규칙
  const cls = (base, variants, compounds = []) => [
    base,
    ...Object.entries(variants).map(([k, v]) => `${base}--${k}_${v}`),
    ...compounds.filter((c) => Object.keys(c).every((k) => c[k] === variants[k]))
      .map((c) => `${base}--${Object.entries(c).map(([k, v]) => `${k}_${v}`).join('-')}`),
  ];
  const SIZES = ['xsmall', 'small', 'medium', 'large'];
  const btnCompounds = SIZES.flatMap((size) => [{ size, layout: 'withText' }, { size, layout: 'iconOnly' }]);
  const chipCompounds = ['large', 'medium', 'small'].flatMap((size) => [{ size, layout: 'withText' }, { size, layout: 'iconOnly' }]);
  const markCompounds = [
    { variant: 'square', tone: 'neutral' }, { variant: 'square', tone: 'brand' },
    { variant: 'ghost', tone: 'neutral' }, { variant: 'ghost', tone: 'brand' },
    { size: 'medium', variant: 'ghost' }, { size: 'large', variant: 'ghost' },
    { size: 'medium', variant: 'square' }, { size: 'large', variant: 'square' },
  ];

  // 원하는 SEED 클래스 묶음을 이전 묶음과 바꿔 끼운다(같으면 손대지 않아 감시 고리가 돌지 않는다)
  const apply = (el, want) => {
    const prev = el.dataset.seedCls || '';
    const next = want.join(' ');
    if (prev === next) return;
    if (prev) el.classList.remove(...prev.split(' '));
    el.classList.add(...want);
    el.dataset.seedCls = next;
  };

  function upgrade(el) {
    if (el.matches('.btn')) {
      const size = el.matches('.t-small') ? 'small' : 'medium';
      apply(el, cls('seed-action-button', { variant: el.matches('.ghost') ? 'neutralOutline' : 'neutralSolid', size, layout: 'withText' }, btnCompounds));
    } else if (el.matches('.chips button, .sk-colors-none')) {
      const size = el.closest('.t-panel') ? 'small' : 'medium';
      apply(el, cls('seed-chip__root', { variant: 'outlineStrong', size, layout: 'withText' }, chipCompounds));
      el.toggleAttribute('data-checked', el.classList.contains('on'));
    } else if (el.matches('input[type="checkbox"]')) {
      apply(el, cls('seed-checkmark__root', { variant: 'square', tone: 'neutral', size: 'medium' }, markCompounds));
    }
  }
  const SEL = '.btn, .chips button, input[type="checkbox"]';
  const scan = (root) => {
    if (root.nodeType !== 1) return;
    if (root.matches(SEL)) upgrade(root);
    root.querySelectorAll(SEL).forEach(upgrade);
  };

  function start() {
    // 3D 화면 위 조절판(.whm3d — 내보낸 파일과 같은 모양을 유지)은 SEED 를 입히지 않는다
    const skip = (el) => el.closest && el.closest('.whm3d');
    scan(document.body);
    new MutationObserver((muts) => {
      for (const m of muts) {
        if (m.type === 'childList') m.addedNodes.forEach((n) => { if (n.nodeType === 1 && !skip(n)) scan(n); });
        else if (m.type === 'attributes' && !skip(m.target) && m.target.matches(SEL)) upgrade(m.target);
      }
    }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
    document.querySelectorAll('.whm3d .seed-checkmark__root').forEach((i) => apply(i, []));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
<script type="module">
/* ── 획 저장소 (assets/sketch/strokes.js) ── */
// 크로키 획 저장소: 그리기·지우기·모두 지우기를 모두 되돌릴 수 있다. DOM 에 의존하지 않는다.
// 획 = { id, tool: 'pen'|'hi'|'arrow'|'text', color, width, coords: [[lon, lat], …], text? }

function createStore() {
  let items = [], undoStack = [], redoStack = [], seq = 1;
  const subs = [];
  const emit = () => subs.forEach((f) => f());

  // 작업 하나를 적용·되돌리는 규칙
  const apply = (op) => {
    if (op.type === 'add') items.splice(op.index, 0, op.stroke);
    else if (op.type === 'erase') items.splice(op.index, 1);
    else if (op.type === 'clear') items = [];
  };
  const revert = (op) => {
    if (op.type === 'add') items.splice(op.index, 1);
    else if (op.type === 'erase') items.splice(op.index, 0, op.stroke);
    else if (op.type === 'clear') items = op.before.slice();
  };
  const run = (op) => { apply(op); undoStack.push(op); redoStack = []; emit(); };

  return {
    list: () => items.slice(),
    add(s) {
      const stroke = { ...s, id: s.id || `s${Date.now().toString(36)}${seq++}` };
      run({ type: 'add', stroke, index: items.length });
      return stroke;
    },
    erase(id) {
      const index = items.findIndex((x) => x.id === id);
      if (index >= 0) run({ type: 'erase', stroke: items[index], index });
    },
    clear() { if (items.length) run({ type: 'clear', before: items.slice() }); },
    undo() { const op = undoStack.pop(); if (op) { revert(op); redoStack.push(op); emit(); } },
    redo() { const op = redoStack.pop(); if (op) { apply(op); undoStack.push(op); emit(); } },
    canUndo: () => undoStack.length > 0,
    canRedo: () => redoStack.length > 0,
    onChange(f) { subs.push(f); },
    dump: () => JSON.stringify(items),
    load(text) {
      try {
        const a = JSON.parse(text);
        items = Array.isArray(a) ? a.filter((x) => x && Array.isArray(x.coords)) : [];
      } catch { items = []; }
      undoStack = []; redoStack = [];
      emit();
    },
    toGeoJSON() {
      return {
        type: 'FeatureCollection',
        features: items.map((s) => (s.tool === 'text'
          ? { type: 'Feature', properties: { tool: 'text', text: s.text || '', color: s.color }, geometry: { type: 'Point', coordinates: s.coords[0] } }
          : { type: 'Feature', properties: { tool: s.tool, color: s.color, width: s.width }, geometry: { type: 'LineString', coordinates: s.coords } })),
      };
    },
  };
}

/* ── 경도 구간 (assets/terrain/clip.js 의 lonExtent) ── */
// 경도 목록을 덮는 가장 짧은 구간 [시작, 끝] — 시작은 -180~180, 끝은 시작보다 크다(180 을 넘을 수 있음).
function lonExtent(lons) {
  const a = lons.map((x) => ((x % 360) + 360) % 360).sort((p, q) => p - q);
  let gap = 360 - a[a.length - 1] + a[0], k = 0; // k: 가장 큰 빈틈 바로 뒤 원소
  for (let i = 1; i < a.length; i++) if (a[i] - a[i - 1] > gap) { gap = a[i] - a[i - 1]; k = i; }
  let start = a[k], end = a[(k - 1 + a.length) % a.length];
  if (end < start) end += 360;
  if (start >= 180) { start -= 360; end -= 360; }
  return [start, end];
}

/* ── 크로키 (assets/sketch/sketch.js) ── */
// 크로키 레시피: 바탕 지도를 깔고 펜·형광펜·화살표·글자로 그린 뒤 PNG·GeoJSON 으로 저장.
// d3 는 전역(index.html 의 script). 획은 경위도로 저장해 확대·이동해도 땅에 붙는다.


const W = 760, H = 500;
const AREA_COLORS = ['#b3261e', '#1f4e79', '#2e7d4f', '#b8860b', '#6a3d9a', '#00838f', '#c2185b', '#5d4037'];
const WIDTHS = { thin: 1.6, mid: 3, thick: 6 };
const FONT = 'Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const $ = (id) => document.getElementById(id);
const getJSON = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u); return r.json(); });
// 자료 주소: 사이트 안에서는 data/, 이 코드를 떼어 다른 곳(파일로 열기 등)에서 쓰면 공개 CDN 으로 넘어간다
const DATA = (typeof window !== 'undefined' && window.SA_DATA) || 'data/';
const CDN = 'https://cdn.jsdelivr.net/gh/yhk1m/space-archive@main/data/';
const getData = (path) => getJSON(DATA + path).catch(() => getJSON(CDN + path));
const enc = (s) => s.split('/').map(encodeURIComponent).join('/');
const store = createStore();
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* 저장 불가 환경 */ } },
};

// d3 는 외곽 고리를 시계 방향으로 기대한다
function rewind(geom) {
  const fix = (ring) => (d3.geoArea({ type: 'Polygon', coordinates: [ring] }) > 2 * Math.PI ? ring.slice().reverse() : ring);
  if (geom.type === 'Polygon') return { type: 'Polygon', coordinates: geom.coordinates.map(fix) };
  if (geom.type === 'MultiPolygon') return { type: 'MultiPolygon', coordinates: geom.coordinates.map((p) => p.map(fix)) };
  return geom;
}

const svgEl = $('skSvg');
if (svgEl) init();

function init() {
  const svg = d3.select(svgEl).attr('viewBox', `0 0 ${W} ${H}`).style('touch-action', 'none');
  const defs = svg.append('defs');
  const bg = svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#f6f5f2');
  const root = svg.append('g');
  const gLand = root.append('path').attr('fill', '#e3e1db');
  const gMap = root.append('g');
  const gInk = root.append('g');
  const gDraft = root.append('g');
  let proj = d3.geoEqualEarth(), path = d3.geoPath(proj), k = 1, land = null, fc = null, mapId = '';
  let tool = 'pen', color = '#b3261e', width = 'mid', space = false, hover = false;
  // 바탕 레이어 고르기: 숨긴 것은 아예 그리지 않아 PNG 에도 빠진다
  let hiddenAreas = new Set(), showLines = true, showPoints = true;

  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-50m.json')
    .then((t) => { land = topojson.feature(t, t.objects.land); drawBase(); }).catch(() => {});

  const zoom = d3.zoom().scaleExtent([1, 30])
    .filter((ev) => ev.type === 'wheel' || (space && !ev.button))
    .on('zoom', (ev) => { k = ev.transform.k; root.attr('transform', ev.transform); scaleText(); });
  svg.call(zoom).on('dblclick.zoom', null);

  // 화살촉: 색마다 하나
  const marker = (c) => {
    const id = 'skArw' + c.slice(1);
    if (defs.select('#' + id).empty()) {
      defs.append('marker').attr('id', id).attr('viewBox', '0 0 10 10').attr('refX', 7).attr('refY', 5)
        .attr('markerWidth', 5).attr('markerHeight', 5).attr('orient', 'auto-start-reverse')
        .append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', c);
    }
    return `url(#${id})`;
  };

  function drawBase() {
    gLand.attr('d', land ? path(land) : null);
    gMap.selectAll('*').remove();
    if (!fc) return;
    let ci = 0;
    for (const f of fc.features) {
      const p = f.properties || {}, g = f.geometry;
      if (!g) continue;
      if (p._t === 'area') {
        const ai = ci++, c = p.color || AREA_COLORS[ai % AREA_COLORS.length];   // 숨겨도 색 순서는 그대로
        if (hiddenAreas.has(ai)) continue;
        gMap.append('path').attr('d', path(rewind(g))).attr('fill', c).attr('fill-opacity', 0.16)
          .attr('stroke', c).attr('stroke-opacity', 0.7).attr('stroke-width', 1).attr('vector-effect', 'non-scaling-stroke');
      }
    }
    for (const f of fc.features) {
      const p = f.properties || {}, g = f.geometry;
      if (p._t === 'line' && g) {
        if (!showLines) continue;
        gMap.append('path').attr('d', path(g)).attr('fill', 'none').attr('stroke', '#555').attr('stroke-width', 1)
          .attr('stroke-dasharray', '4 3').attr('vector-effect', 'non-scaling-stroke');
      } else if (p._t === 'point' && g) {
        if (!showPoints) continue;
        const xy = proj(g.coordinates);
        if (!xy) continue;
        gMap.append('circle').attr('class', 'sk-pt').attr('cx', xy[0]).attr('cy', xy[1]).attr('r', 2.4 / k).attr('fill', '#111');
        gMap.append('text').attr('class', 'sk-scale').attr('data-size', 10).attr('x', xy[0] + 4 / k).attr('y', xy[1] - 3 / k)
          .attr('font-family', FONT).attr('font-size', 10 / k).attr('fill', '#333').attr('paint-order', 'stroke')
          .attr('stroke', '#fff').attr('stroke-width', 2.5 / k).text(p.name || '');
      }
    }
    drawInk();
  }

  function strokeEl(g, s) {
    if (s.tool === 'text') {
      const xy = proj(s.coords[0]);
      if (!xy) return;
      g.append('text').attr('data-id', s.id).attr('class', 'sk-scale').attr('data-size', 16)
        .attr('x', xy[0]).attr('y', xy[1]).attr('font-family', FONT).attr('font-weight', 700)
        .attr('font-size', 16 / k).attr('fill', s.color).attr('paint-order', 'stroke').attr('stroke', '#fff').attr('stroke-width', 3 / k)
        .text(s.text);
      return;
    }
    const pts = s.tool === 'arrow' ? [s.coords[0], s.coords[s.coords.length - 1]] : s.coords;
    const d = d3.line()(pts.map((c) => proj(c)).filter(Boolean));
    const el = g.append('path').attr('data-id', s.id).attr('d', d).attr('fill', 'none').attr('stroke', s.color)
      .attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round').attr('vector-effect', 'non-scaling-stroke');
    if (s.tool === 'hi') el.attr('stroke-width', s.width * 4).attr('stroke-opacity', 0.35);
    else el.attr('stroke-width', s.width);
    if (s.tool === 'arrow') el.attr('marker-end', marker(s.color));
  }
  function drawInk() {
    gInk.selectAll('*').remove();
    store.list().forEach((s) => strokeEl(gInk, s));
    scaleText();
  }
  // 글자·점은 확대해도 화면 크기가 같게
  function scaleText() {
    root.selectAll('.sk-scale').each(function () {
      const t = d3.select(this), sz = +t.attr('data-size');
      t.attr('font-size', sz / k).attr('stroke-width', (sz > 12 ? 3 : 2.5) / k);
    });
    root.selectAll('.sk-pt').attr('r', 2.4 / k);
  }

  // 바탕 지도 바꾸기: 그리던 것은 지도별로 브라우저에 기억
  // 행정구역 바탕(id = 'admin:<단위>:<연도>'): 연도 판 + (시·도·시·군·구면) 북한. 권역은 그 권역 색으로, 시·도·시·군·구는 회색 한 색
  let adminIndex = null;
  const ADMIN_LEVELS = { region7: '국토 7대 권역', regiontrad: '전통 지역 구분', sido: '시·도', sigungu: '시·군·구' };
  async function loadAdmin(id) {
    const [, level, year] = id.split(':');
    adminIndex = adminIndex || await getData('admin/index.json');
    const files = [adminIndex.files[year]['kr_' + level]];
    if (level === 'sido' || level === 'sigungu') files.unshift(adminIndex.kp[level]);
    const fcs = await Promise.all(files.map((f) => getData('admin/' + f)));
    const plain = level === 'sido' || level === 'sigungu';
    return { type: 'FeatureCollection', features: fcs.flatMap((c) => c.features).map((f) => ({
      type: 'Feature', geometry: f.geometry,
      properties: { _t: 'area', name: f.properties.full || f.properties.name, color: plain ? '#455a64' : undefined },
    })) };
  }

  async function setMap(id) {
    if (mapId !== null) ls.set('sa-sketch:' + mapId, store.dump());
    mapId = id;
    fc = !id ? null : id.startsWith('admin:') ? await loadAdmin(id) : await getData('lite/maps/' + enc(id) + '.json');
    if (fc) {
      const lons = [], pts = [];
      const walk = (c) => { if (typeof c[0] === 'number') { lons.push(c[0]); pts.push(c); } else c.forEach(walk); };
      fc.features.forEach((f) => f.geometry && walk(f.geometry.coordinates));
      const [w, e] = lonExtent(lons);
      proj = d3.geoEqualEarth().rotate([-(w + e) / 2, 0]).fitExtent([[20, 20], [W - 20, H - 20]], { type: 'MultiPoint', coordinates: pts });
    } else {
      proj = d3.geoEqualEarth().fitExtent([[10, 10], [W - 10, H - 10]], { type: 'Sphere' });
    }
    path = d3.geoPath(proj);
    svg.call(zoom.transform, d3.zoomIdentity);
    store.load(ls.get('sa-sketch:' + id) || '[]');
    hiddenAreas = new Set(); showLines = true; showPoints = true;
    buildLayers();
    drawBase();
  }

  // 바탕 레이어 목록: 영역(이름 + 색) · 경로 · 지점
  function buildLayers() {
    const box = $('skLayers');
    if (!box) return;
    box.innerHTML = '';
    const feats = fc ? fc.features.filter((f) => f.geometry) : [];
    const areas = feats.filter((f) => (f.properties || {})._t === 'area');
    const nLine = feats.filter((f) => (f.properties || {})._t === 'line').length;
    const nPt = feats.filter((f) => (f.properties || {})._t === 'point').length;
    const item = (label, swatch, on, fn, extra) => {
      const lab = document.createElement('label');
      lab.className = 'sk-check' + (extra ? ' ' + extra : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = on;
      cb.addEventListener('change', () => { fn(cb.checked); drawBase(); });
      lab.appendChild(cb);
      if (swatch) { const sw = document.createElement('i'); sw.className = 'sk-sw'; sw.style.setProperty('--c', swatch); lab.appendChild(sw); }
      lab.appendChild(document.createTextNode(label));
      box.appendChild(lab);
    };
    if (areas.length > 30) {
      // 시·군·구처럼 구역이 많으면 하나씩 고르지 않고 묶음으로 켜고 끈다
      item(`구역 (${areas.length})`, areas[0].properties.color || AREA_COLORS[0], hiddenAreas.size === 0,
        (on) => { hiddenAreas = on ? new Set() : new Set(areas.map((_, i) => i)); }, 'grp');
    } else areas.forEach((f, i) => item(f.properties.name || `영역 ${i + 1}`, f.properties.color || AREA_COLORS[i % AREA_COLORS.length], !hiddenAreas.has(i),
      (on) => { if (on) hiddenAreas.delete(i); else hiddenAreas.add(i); }));
    if (nLine) item(`경로 (${nLine})`, null, showLines, (on) => { showLines = on; }, 'grp');
    if (nPt) item(`지점 (${nPt})`, null, showPoints, (on) => { showPoints = on; }, 'grp');
    if (!box.childNodes.length) box.innerHTML = '<p class="sk-none">이 바탕에는 고를 레이어가 없습니다.</p>';
  }

  // 그리기
  const lonLat = (ev) => {
    const [x, y] = d3.zoomTransform(svgEl).invert(d3.pointer(ev, svgEl));
    return proj.invert([x, y]);
  };
  let cur = null, lastPx = null;
  svg.on('pointerdown.sk', (ev) => {
    if (space || ev.button) return;
    ev.preventDefault();
    if (tool === 'erase') {
      const id = ev.target.getAttribute && ev.target.getAttribute('data-id');
      if (id) store.erase(id);
      return;
    }
    const p = lonLat(ev);
    if (!p) return;
    if (tool === 'text') { askText(ev, p); return; }
    cur = { tool, color, width: WIDTHS[width], coords: [p] };
    lastPx = d3.pointer(ev, svgEl);
    try { svgEl.setPointerCapture(ev.pointerId); } catch { /* 합성 이벤트 등 */ }
  });
  svg.on('pointermove.sk', (ev) => {
    if (!cur) {
      if (tool === 'erase' && ev.buttons === 1) { const id = ev.target.getAttribute && ev.target.getAttribute('data-id'); if (id) store.erase(id); }
      return;
    }
    const px = d3.pointer(ev, svgEl);
    if (Math.hypot(px[0] - lastPx[0], px[1] - lastPx[1]) < 2) return;
    lastPx = px;
    const p = lonLat(ev);
    if (!p) return;
    if (cur.tool === 'arrow') cur.coords[1] = p; else cur.coords.push(p);
    gDraft.selectAll('*').remove();
    strokeEl(gDraft, { ...cur, id: 'draft' });
  });
  const end = () => {
    if (!cur) return;
    gDraft.selectAll('*').remove();
    if (cur.coords.length > 1) store.add(cur);
    cur = null;
  };
  svg.on('pointerup.sk', end).on('pointercancel.sk', end);

  // 글자: 누른 자리에 입력 칸을 띄운다(브라우저 대화상자 대신)
  function askText(ev, p) {
    const fig = svgEl.parentElement, r = fig.getBoundingClientRect();
    const box = document.createElement('input');
    box.className = 'sk-input'; box.placeholder = '글자 입력 후 Enter';
    box.style.left = (ev.clientX - r.left) + 'px'; box.style.top = (ev.clientY - r.top - 14) + 'px';
    box.style.color = color;
    fig.appendChild(box);
    setTimeout(() => box.focus(), 0);
    let done = false;
    const finish = (ok) => {
      if (done) return; done = true;
      const t = box.value.trim();
      box.remove();
      if (ok && t) store.add({ tool: 'text', color, width: 2, coords: [p], text: t });
    };
    box.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); e.stopPropagation(); });
    box.addEventListener('blur', () => finish(true));
  }

  store.onChange(() => {
    drawInk();
    ls.set('sa-sketch:' + mapId, store.dump());
    $('skUndo').disabled = !store.canUndo();
    $('skRedo').disabled = !store.canRedo();
  });

  // 키보드: 지도 위에 마우스가 있을 때 Space = 이동, Ctrl+Z / Ctrl+Y
  svgEl.addEventListener('pointerenter', () => { hover = true; });
  svgEl.addEventListener('pointerleave', () => { hover = false; });
  window.addEventListener('keydown', (e) => {
    if (!hover || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { space = true; svgEl.classList.add('panning'); e.preventDefault(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? store.redo() : store.undo(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); store.redo(); }
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'Space') { space = false; svgEl.classList.remove('panning'); } });

  // 도구 단추
  const pick = (sel, attr, fn) => document.querySelectorAll(sel).forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll(sel).forEach((x) => x.classList.toggle('on', x === b));
    fn(b.dataset[attr]);
  }));
  pick('#skTools button', 'tool', (v) => { tool = v; svgEl.dataset.tool = v; });
  pick('#skWidths button', 'w', (v) => { width = v; });
  pick('#skColors button', 'c', (v) => { color = v; });
  $('skUndo').addEventListener('click', () => store.undo());
  $('skRedo').addEventListener('click', () => store.redo());
  $('skClear').addEventListener('click', () => store.clear());
  $('skFit').addEventListener('click', () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity));
  const mapValue = () => {
    const v = $('skMap').value, admin = v.startsWith('admin:');
    if ($('skYear')) $('skYear').hidden = !admin;
    return admin ? `${v}:${$('skYear').value}` : v;
  };
  $('skMap').addEventListener('change', () => setMap(mapValue()));
  if ($('skYear')) $('skYear').addEventListener('change', () => setMap(mapValue()));

  const save = (name, blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  const baseName = () => '크로키_' + ($('skMap').selectedOptions[0]?.textContent || '지도').replace(/[\\/:*?"<>|·]+/g, '_').replace(/\s+/g, '');
  $('skGeo').addEventListener('click', () => save(baseName() + '.geojson', new Blob([JSON.stringify(store.toGeoJSON())], { type: 'application/geo+json' })));
  $('skPng').addEventListener('click', () => {
    const clone = svgEl.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', W * 2); clone.setAttribute('height', H * 2);
    // 화면 굵기를 유지하는 선(non-scaling)은 2배 크기 그림에서 같은 비율이 되도록 굵기도 2배
    clone.querySelectorAll('[vector-effect]').forEach((e) => e.setAttribute('stroke-width', (+e.getAttribute('stroke-width') || 1) * 2));
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml' }));
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = W * 2; cv.height = H * 2;
      cv.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      cv.toBlob((b) => save(baseName() + '.png', b), 'image/png');
    };
    img.src = url;
  });

  // 바탕 지도 목록: 한국사 + 세계사 교과서
  Promise.all([getData('index.json'), getData('lite/korea_index.json').catch(() => ({ maps: [] })), getData('admin/index.json').catch(() => null)]).then(([world, korea, admin]) => {
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const opt = (id, label) => `<option value="${esc(id)}">${esc(label)}</option>`;
    $('skMap').innerHTML = opt('', '바탕만 (세계)')
      + `<optgroup label="한국사">${korea.maps.map((m) => opt(m.id, '한국사 · ' + m.title)).join('')}</optgroup>`
      + (admin ? `<optgroup label="행정구역(남북한)">${Object.entries(ADMIN_LEVELS).map(([k, l]) => opt('admin:' + k, '행정구역 · ' + l)).join('')}</optgroup>` : '')
      + `<optgroup label="세계사 교과서">${world.maps.map((m) => opt(m.id, `${m.vol}권 ${m.page}쪽 · ${m.title}`)).join('')}</optgroup>`;
    if (admin && $('skYear')) $('skYear').innerHTML = admin.years.slice().reverse().map((y) => `<option value="${y}">${y}년</option>`).join('');
    const first = world.maps.find((m) => m.id.includes('p080')) || world.maps[0];
    $('skMap').value = first.id;
    mapId = null;
    setMap(first.id);
  }).catch((e) => console.error('[SA] sketch', e));

  window.__sketch = { store, setMap, get proj() { return proj; }, zoom: (t) => svg.call(zoom.transform, t) };
}

</script>
